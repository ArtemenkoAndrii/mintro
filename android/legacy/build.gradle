import com.android.build.api.dsl.ManagedVirtualDevice

apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.mas.mobile"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 39
        versionName "1.2.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments useTestStorageService: 'true'

        Properties properties = new Properties()
        properties.load(project.rootProject.file("local.properties").newDataInputStream())
        buildConfigField "String", "GPT_API_KEY", "\"${properties.getProperty("GPT_API_KEY")}\""
        buildConfigField "String", "FREE_CURRENCY_API_KEY", "\"${properties.getProperty("FREE_CURRENCY_API_KEY")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        dataBinding true
    }
    namespace 'com.mas.mobile'

    testOptions {
        // The orchestrator APK itself fails to install on the minimal AOSP-ATD managed-
        // device image ("Failed to install APK ... orchestrator-1.5.1.apk"). Per-test
        // process isolation is a nice-to-have, not required for the current suite - default
        // (non-orchestrated) execution is enough to get real coverage running. Revisit if
        // ATD/orchestrator compatibility improves, or switch systemImageSource to "google"
        // if orchestrator support turns out to matter more than the smaller/faster ATD image.
        // execution 'ANDROIDX_TEST_ORCHESTRATOR'

        managedDevices {
            devices {
                pixel8Api34(ManagedVirtualDevice) {
                    // "Pixel 8" isn't a hardware-profile name this SDK's Gradle Managed
                    // Device catalog recognizes (that catalog is separate from Android
                    // Studio's Device Manager, which is where a "Pixel 8" AVD can be
                    // created - confirmed the two don't share profile data on this
                    // install). "Pixel 5" is the newest name GMD actually resolves here;
                    // it only picks the emulator's skin, not the API level under test.
                    device = "Pixel 5"
                    apiLevel = 34
                    // "aosp-atd" (Automated Test Device - a stripped-down, speed-optimized
                    // image) never grants real Android window focus to the app in this setup:
                    // the window displays but Espresso's RootViewPicker times out waiting for
                    // has-window-focus=true on every test, and wake/unlock/freeform/animation
                    // adb fixes made no difference - points at the ATD image itself, not device
                    // state. "aosp" (regular, non-ATD) has a broken/partial local SDK install
                    // on this machine ("System image does not exist" despite package.xml being
                    // present). "google" is a clean, standard, widely-used image, most likely
                    // to have normal window-focus behavior and a clean download path.
                    systemImageSource = "google"
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas".toString())
    }
}

configurations.configureEach {
    resolutionStrategy {
        force("com.google.android.play:app-update:2.1.0")
        force("com.google.android.play:feature-delivery:2.1.0")
    }
}

dependencies {
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))

    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.recyclerview:recyclerview:1.3.2")

    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.8.4")

    implementation("androidx.navigation:navigation-dynamic-features-fragment:2.7.7")
    implementation("androidx.navigation:navigation-ui-ktx:2.7.7")
    implementation("androidx.navigation:navigation-fragment-ktx:2.7.7") {
        exclude group: "androidx.lifecycle"
        exclude group: "com.google.android.play"
    }

    implementation("com.google.android.play:feature-delivery:2.1.0")
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")

    implementation("androidx.work:work-runtime-ktx:2.9.1")

    implementation("com.google.android.material:material:1.12.0")

    implementation("com.github.midorikocak:currency-picker-android:1.2.1")

    // Room
    def room_version = "2.5.0"
    implementation("androidx.room:room-runtime:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    kapt("androidx.room:room-compiler:$room_version")

    // Retrofit & Networking
    def retrofit_version = "2.9.0"
    implementation("com.squareup.retrofit2:retrofit:$retrofit_version")
    implementation("com.squareup.retrofit2:converter-gson:$retrofit_version")

    // Dagger
    def dagger_version = "2.40.1"
    implementation("com.google.dagger:dagger:$dagger_version")
    kapt("com.google.dagger:dagger-compiler:$dagger_version")

    // Firebase
    implementation(platform("com.google.firebase:firebase-bom:33.0.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-crashlytics:19.0.3")

    //Misc
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")
    implementation("com.maltaisn:icondialog:3.3.0")
    implementation("com.maltaisn:iconpack-default:1.1.0")

    // Testing Libraries
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0-RC2")
    testImplementation("org.jetbrains.kotlin:kotlin-test:1.8.0-RC2")
    testImplementation ("io.mockk:mockk:1.13.12") {
        exclude group: 'org.junit', module: 'junit'
    }
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.3")
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.10.3")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.3")

    // Instrumented Testing Libraries
    androidTestImplementation("androidx.test:core-ktx:1.6.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
    androidTestImplementation("androidx.test.espresso:espresso-contrib:3.6.1") {
        exclude group: "com.android.support", module: "support-annotations"
    }
    androidTestImplementation("androidx.navigation:navigation-testing:2.7.7")
    // NOTE: androidx.fragment:fragment-testing (for FragmentScenario) is deliberately not
    // included yet - its 1.6.2 POM publishes `strictly` constraints on androidx.test:core/
    // monitor that downgrade them below what espresso-core:3.6.1 needs at runtime, causing
    // `NoClassDefFoundError: DirectExecutor`. None of the current tests use FragmentScenario;
    // re-add it (with an explicit resolutionStrategy force on androidx.test:core/monitor to
    // the versions below) only once a test actually needs it.
    androidTestImplementation("androidx.room:room-testing:$room_version")
    androidTestUtil("androidx.test:orchestrator:1.5.1")
}